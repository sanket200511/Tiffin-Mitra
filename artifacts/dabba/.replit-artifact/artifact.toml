kind = "web"
previewPath = "/"
title = "Dabba — Tiffin Service Platform"
version = "1.0.0"
id = "artifacts/dabba"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25589

[services.development]
run = "pnpm --filter @workspace/dabba run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dabba", "run", "build" ]
publicDir = "artifacts/dabba/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25589"
BASE_PATH = "/"
