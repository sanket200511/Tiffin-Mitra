version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dabba
      POSTGRES_USER: dabba
      POSTGRES_PASSWORD: dabba_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dabba"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      target: runner
    environment:
      PORT: 8080
      NODE_ENV: production
      DATABASE_URL: postgresql://dabba:dabba_dev_password@db:5432/dabba
      SESSION_SECRET: change_me_in_production_use_a_long_random_string
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
