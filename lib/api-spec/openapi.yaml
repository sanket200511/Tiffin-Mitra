openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Dabba Tiffin Service Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: vendors
    description: Vendor management
  - name: menus
    description: Menu and meal plan management
  - name: subscriptions
    description: Subscription management
  - name: orders
    description: Order management
  - name: customers
    description: Customer management
  - name: reviews
    description: Reviews and feedback
  - name: analytics
    description: Analytics and business intelligence
  - name: deliveries
    description: Delivery management

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'

  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.

  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirect to the returnTo path on success.

  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.

  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'

  # ─── VENDORS ───────────────────────────────────────────────────────────────
  /vendors:
    get:
      tags: [vendors]
      operationId: listVendors
      summary: List vendors (public – for customer discovery)
      parameters:
        - name: city
          in: query
          schema:
            type: string
        - name: cuisine
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of vendors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorListEnvelope"
    post:
      tags: [vendors]
      operationId: createVendor
      summary: Register a new vendor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVendorBody"
      responses:
        "201":
          description: Vendor created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorEnvelope"

  /vendors/me:
    get:
      tags: [vendors]
      operationId: getMyVendorProfile
      summary: Get the authenticated vendor's own profile
      responses:
        "200":
          description: Vendor profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorEnvelope"

  /vendors/{vendorId}:
    get:
      tags: [vendors]
      operationId: getVendor
      summary: Get a vendor by ID
      parameters:
        - $ref: "#/components/parameters/VendorId"
      responses:
        "200":
          description: Vendor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorEnvelope"
    patch:
      tags: [vendors]
      operationId: updateVendor
      summary: Update vendor profile
      parameters:
        - $ref: "#/components/parameters/VendorId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVendorBody"
      responses:
        "200":
          description: Updated vendor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorEnvelope"

  /vendors/{vendorId}/stats:
    get:
      tags: [vendors]
      operationId: getVendorStats
      summary: Get aggregate stats for a vendor (revenue, orders, subscriptions)
      parameters:
        - $ref: "#/components/parameters/VendorId"
      responses:
        "200":
          description: Vendor stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorStatsEnvelope"

  # ─── MENUS ─────────────────────────────────────────────────────────────────
  /vendors/{vendorId}/menus:
    get:
      tags: [menus]
      operationId: listMenuItems
      summary: List menu items for a vendor
      parameters:
        - $ref: "#/components/parameters/VendorId"
        - name: mealType
          in: query
          schema:
            type: string
            enum: [breakfast, lunch, dinner, snacks]
        - name: dietType
          in: query
          schema:
            type: string
            enum: [veg, non_veg, jain, diabetic_friendly]
      responses:
        "200":
          description: Menu items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItemListEnvelope"
    post:
      tags: [menus]
      operationId: createMenuItem
      summary: Create a menu item
      parameters:
        - $ref: "#/components/parameters/VendorId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMenuItemBody"
      responses:
        "201":
          description: Created menu item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItemEnvelope"

  /vendors/{vendorId}/menus/{menuItemId}:
    patch:
      tags: [menus]
      operationId: updateMenuItem
      summary: Update a menu item
      parameters:
        - $ref: "#/components/parameters/VendorId"
        - $ref: "#/components/parameters/MenuItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMenuItemBody"
      responses:
        "200":
          description: Updated menu item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItemEnvelope"
    delete:
      tags: [menus]
      operationId: deleteMenuItem
      summary: Delete a menu item
      parameters:
        - $ref: "#/components/parameters/VendorId"
        - $ref: "#/components/parameters/MenuItemId"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"

  # ─── SUBSCRIPTION PLANS ────────────────────────────────────────────────────
  /vendors/{vendorId}/plans:
    get:
      tags: [subscriptions]
      operationId: listSubscriptionPlans
      summary: List subscription plans for a vendor
      parameters:
        - $ref: "#/components/parameters/VendorId"
      responses:
        "200":
          description: Subscription plans
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionPlanListEnvelope"
    post:
      tags: [subscriptions]
      operationId: createSubscriptionPlan
      summary: Create a subscription plan
      parameters:
        - $ref: "#/components/parameters/VendorId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubscriptionPlanBody"
      responses:
        "201":
          description: Created plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionPlanEnvelope"

  /vendors/{vendorId}/plans/{planId}:
    patch:
      tags: [subscriptions]
      operationId: updateSubscriptionPlan
      summary: Update a subscription plan
      parameters:
        - $ref: "#/components/parameters/VendorId"
        - $ref: "#/components/parameters/PlanId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSubscriptionPlanBody"
      responses:
        "200":
          description: Updated plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionPlanEnvelope"
    delete:
      tags: [subscriptions]
      operationId: deleteSubscriptionPlan
      summary: Delete a subscription plan
      parameters:
        - $ref: "#/components/parameters/VendorId"
        - $ref: "#/components/parameters/PlanId"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"

  # ─── CUSTOMER SUBSCRIPTIONS ────────────────────────────────────────────────
  /subscriptions:
    get:
      tags: [subscriptions]
      operationId: listMySubscriptions
      summary: List current user's active subscriptions
      responses:
        "200":
          description: Subscriptions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerSubscriptionListEnvelope"
    post:
      tags: [subscriptions]
      operationId: createCustomerSubscription
      summary: Subscribe to a plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomerSubscriptionBody"
      responses:
        "201":
          description: Subscription created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerSubscriptionEnvelope"

  /subscriptions/{subscriptionId}:
    get:
      tags: [subscriptions]
      operationId: getCustomerSubscription
      summary: Get a customer subscription
      parameters:
        - $ref: "#/components/parameters/SubscriptionId"
      responses:
        "200":
          description: Subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerSubscriptionEnvelope"
    patch:
      tags: [subscriptions]
      operationId: updateCustomerSubscription
      summary: Pause, resume, or cancel a subscription
      parameters:
        - $ref: "#/components/parameters/SubscriptionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCustomerSubscriptionBody"
      responses:
        "200":
          description: Updated subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerSubscriptionEnvelope"

  /subscriptions/{subscriptionId}/skip:
    post:
      tags: [subscriptions]
      operationId: skipSubscriptionDay
      summary: Skip a delivery day
      parameters:
        - $ref: "#/components/parameters/SubscriptionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkipDayBody"
      responses:
        "200":
          description: Day skipped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"

  # ─── ORDERS ────────────────────────────────────────────────────────────────
  /orders:
    get:
      tags: [orders]
      operationId: listOrders
      summary: List orders (customer sees their own; vendor sees all for their kitchen)
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, accepted, preparing, packed, picked_up, delivered, cancelled]
        - name: date
          in: query
          schema:
            type: string
            format: date
        - name: vendorId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderListEnvelope"

  /orders/{orderId}:
    get:
      tags: [orders]
      operationId: getOrder
      summary: Get a single order
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderEnvelope"
    patch:
      tags: [orders]
      operationId: updateOrderStatus
      summary: Update order status
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrderStatusBody"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderEnvelope"

  /orders/today-summary:
    get:
      tags: [orders]
      operationId: getTodayOrderSummary
      summary: Get today's order summary (counts by status and meal type)
      parameters:
        - name: vendorId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Today's summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodaySummaryEnvelope"

  # ─── CUSTOMERS ─────────────────────────────────────────────────────────────
  /customers/me:
    get:
      tags: [customers]
      operationId: getMyCustomerProfile
      summary: Get or create the current user's customer profile
      responses:
        "200":
          description: Customer profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerEnvelope"
    patch:
      tags: [customers]
      operationId: updateMyCustomerProfile
      summary: Update customer profile / delivery address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCustomerProfileBody"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerEnvelope"

  /customers/wallet:
    get:
      tags: [customers]
      operationId: getWalletBalance
      summary: Get current wallet balance and recent transactions
      responses:
        "200":
          description: Wallet info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletEnvelope"

  /customers/upcoming-deliveries:
    get:
      tags: [customers]
      operationId: getUpcomingDeliveries
      summary: Get next 7 days of scheduled deliveries for the customer
      responses:
        "200":
          description: Upcoming deliveries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpcomingDeliveriesEnvelope"

  # ─── REVIEWS ───────────────────────────────────────────────────────────────
  /reviews:
    get:
      tags: [reviews]
      operationId: listReviews
      summary: List reviews (by vendor or customer)
      parameters:
        - name: vendorId
          in: query
          schema:
            type: string
        - name: customerId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Reviews
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewListEnvelope"
    post:
      tags: [reviews]
      operationId: createReview
      summary: Submit a review for a meal/order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewBody"
      responses:
        "201":
          description: Review created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewEnvelope"

  # ─── ANALYTICS ─────────────────────────────────────────────────────────────
  /analytics/vendor/{vendorId}/revenue:
    get:
      tags: [analytics]
      operationId: getVendorRevenueTrend
      summary: Revenue trend for a vendor
      parameters:
        - $ref: "#/components/parameters/VendorId"
        - name: period
          in: query
          schema:
            type: string
            enum: [7d, 30d, 90d]
            default: 30d
      responses:
        "200":
          description: Revenue trend
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevenueTrendEnvelope"

  /analytics/vendor/{vendorId}/popular-dishes:
    get:
      tags: [analytics]
      operationId: getPopularDishes
      summary: Most popular dishes for a vendor
      parameters:
        - $ref: "#/components/parameters/VendorId"
      responses:
        "200":
          description: Popular dishes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PopularDishesEnvelope"

  /analytics/vendor/{vendorId}/subscription-health:
    get:
      tags: [analytics]
      operationId: getSubscriptionHealth
      summary: Active vs paused vs cancelled subscriptions breakdown
      parameters:
        - $ref: "#/components/parameters/VendorId"
      responses:
        "200":
          description: Subscription health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionHealthEnvelope"

  /analytics/platform/overview:
    get:
      tags: [analytics]
      operationId: getPlatformOverview
      summary: Super admin platform overview (GMV, vendors, subscriptions)
      responses:
        "200":
          description: Platform overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformOverviewEnvelope"

  # ─── DELIVERIES ────────────────────────────────────────────────────────────
  /deliveries:
    get:
      tags: [deliveries]
      operationId: listDeliveries
      summary: List deliveries (for delivery agent or vendor)
      parameters:
        - name: date
          in: query
          schema:
            type: string
            format: date
        - name: status
          in: query
          schema:
            type: string
            enum: [assigned, in_progress, completed, failed]
      responses:
        "200":
          description: Deliveries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryListEnvelope"

  /deliveries/{deliveryId}/status:
    patch:
      tags: [deliveries]
      operationId: updateDeliveryStatus
      summary: Update delivery status
      parameters:
        - name: deliveryId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDeliveryStatusBody"
      responses:
        "200":
          description: Updated delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"

components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — Bearer <sid>.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
    VendorId:
      name: vendorId
      in: path
      required: true
      schema:
        type: string
    MenuItemId:
      name: menuItemId
      in: path
      required: true
      schema:
        type: string
    PlanId:
      name: planId
      in: path
      required: true
      schema:
        type: string
    SubscriptionId:
      name: subscriptionId
      in: path
      required: true
      schema:
        type: string
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    SuccessEnvelope:
      type: object
      required: [success]
      properties:
        success:
          type: boolean

    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true

    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
          format: email
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
        role:
          type: [string, 'null']
          enum: [super_admin, vendor, customer, delivery_agent, kitchen_staff, null]

    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'

    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
          format: uri
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1

    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string

    # ─── VENDOR ──────────────────────────────────────────────────────────────
    Vendor:
      type: object
      required: [id, name, ownerUserId, city, cuisineType, status, subscriptionTier, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        ownerUserId:
          type: string
        description:
          type: [string, 'null']
        city:
          type: string
        address:
          type: [string, 'null']
        cuisineType:
          type: string
        logoUrl:
          type: [string, 'null']
        coverImageUrl:
          type: [string, 'null']
        rating:
          type: [number, 'null']
        reviewCount:
          type: integer
        status:
          type: string
          enum: [pending, approved, suspended]
        subscriptionTier:
          type: string
          enum: [basic, pro, enterprise]
        fssaiLicense:
          type: [string, 'null']
        deliveryZones:
          type: array
          items:
            type: string
        featured:
          type: boolean
        commissionRate:
          type: number
        createdAt:
          type: string
          format: date-time

    VendorEnvelope:
      type: object
      required: [vendor]
      properties:
        vendor:
          $ref: "#/components/schemas/Vendor"

    VendorListEnvelope:
      type: object
      required: [vendors]
      properties:
        vendors:
          type: array
          items:
            $ref: "#/components/schemas/Vendor"

    CreateVendorBody:
      type: object
      required: [name, city, cuisineType]
      properties:
        name:
          type: string
        description:
          type: string
        city:
          type: string
        address:
          type: string
        cuisineType:
          type: string
        fssaiLicense:
          type: string
        subscriptionTier:
          type: string
          enum: [basic, pro, enterprise]
          default: basic

    UpdateVendorBody:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        city:
          type: string
        address:
          type: string
        cuisineType:
          type: string
        logoUrl:
          type: string
        coverImageUrl:
          type: string
        status:
          type: string
          enum: [pending, approved, suspended]
        subscriptionTier:
          type: string
          enum: [basic, pro, enterprise]
        deliveryZones:
          type: array
          items:
            type: string

    VendorStats:
      type: object
      required: [totalRevenue, totalOrders, activeSubscriptions, averageRating, todayOrders, monthlyRevenue]
      properties:
        totalRevenue:
          type: number
        totalOrders:
          type: integer
        activeSubscriptions:
          type: integer
