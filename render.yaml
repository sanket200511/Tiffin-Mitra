services:
  # ----------------------------------------------------------------------------
  # Backend: API Server
  # ----------------------------------------------------------------------------
  - type: web
    name: dabba-api
    env: node
    plan: free
    rootDir: .
    buildCommand: pnpm install && pnpm --filter @workspace/db build && pnpm --filter @workspace/api-server build
    startCommand: pnpm --filter @workspace/api-server start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        # Use Internal Database URL for better performance
        value: postgresql://sanket_postgres:s0Kl8yjT1RH1eAofymqo4S1C89HTqMG9@dpg-d7s59gi8qa3s73dtee0g-a/postgres_sanket?search_path=dabba
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false # Set this in Render Dashboard
      - key: GOOGLE_CLIENT_SECRET
        sync: false # Set this in Render Dashboard
      - key: GOOGLE_REDIRECT_URI
        fromValue: https://dabba-api.onrender.com/api/auth/google/callback
      - key: FRONTEND_URL
        fromValue: https://dabba-app.onrender.com
      - key: RESEND_API_KEY
        sync: false # Set this in Render Dashboard

  # ----------------------------------------------------------------------------
  # Frontend: Dabba App
  # ----------------------------------------------------------------------------
  - type: web
    name: dabba-app
    env: node
    plan: free
    rootDir: .
    buildCommand: pnpm install && pnpm --filter @workspace/dabba build
    startCommand: pnpm --filter @workspace/dabba start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromValue: https://dabba-api.onrender.com
