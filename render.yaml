services:
  # ----------------------------------------------------------------------------
  # Backend: API Server
  # ----------------------------------------------------------------------------
  - type: web
    name: dabba-api
    env: node
    plan: free
    rootDir: .
    buildCommand: pnpm install && pnpm --filter @workspace/db push:prod && pnpm --filter @workspace/api-server build
    startCommand: pnpm --filter @workspace/api-server start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        sync: false # Set the Internal Database URL in the Render Dashboard
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false # Set this in Render Dashboard
      - key: GOOGLE_CLIENT_SECRET
        sync: false # Set this in Render Dashboard
      - key: GOOGLE_REDIRECT_URI
        value: https://dabba-api.onrender.com/api/auth/google/callback
      - key: FRONTEND_URL
        value: https://dabba-app.onrender.com
      - key: RESEND_API_KEY
        sync: false # Set this in Render Dashboard
      - key: CLOUDINARY_CLOUD_NAME
        sync: false # Set this in Render Dashboard
      - key: CLOUDINARY_API_KEY
        sync: false # Set this in Render Dashboard
      - key: CLOUDINARY_API_SECRET
        sync: false # Set this in Render Dashboard
      - key: REDIS_URL
        sync: false # Set this in Render Dashboard

  # ----------------------------------------------------------------------------
  # Frontend: Dabba App
  # ----------------------------------------------------------------------------
  - type: web
    name: dabba-app
    env: static
    rootDir: .
    buildCommand: pnpm install && pnpm --filter @workspace/dabba build
    staticPublishPath: artifacts/dabba/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_URL
        value: https://dabba-api.onrender.com
